plugins {
    id 'java'
    id 'jacoco'
    id 'application'
}

application {
    mainClass = 'ru.nsu.masolygin.oopchecker.cli.Main'
    // Форсируем UTF-8 для stdout/stderr на Windows (cp1251/cp866 по умолчанию).
    // -Dstdout.encoding/-Dstderr.encoding — Java 17.0.2+ системное свойство.
    applicationDefaultJvmArgs = [
        '-Dfile.encoding=UTF-8',
        '-Dstdout.encoding=UTF-8',
        '-Dstderr.encoding=UTF-8'
    ]
}

group   = 'ru.nsu.masolygin'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.apache.groovy:groovy:4.0.21'
    testImplementation platform('org.junit:junit-bom:5.9.1')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(Javadoc).configureEach {
    options.encoding = 'UTF-8'
    options.charSet = 'UTF-8'
}

test {
    useJUnitPlatform()
}

jacocoTestReport {
    reports {
        xml.required = true
    }
}
